workflow_name: FluxDev
discord_command: dream
description: Run dream workflow
mapping:
  text:
    - '198:3'
    - inputs
    - text
  ratio_selected:
    - '258'
    - inputs
    - ratio_selected
  ➕ Add Lora:
    - '271'
    - inputs
    - ➕ Add Lora
inputs:
  - id: text
    type: text
    label: text
    required: true
  - id: ratio_selected
    type: select
    label: ratio_selected
    required: true
    choices:
      - 1:1 [1024x1024 square]
      - 8:5 [1216x768 landscape]
      - 4:3 [1152x896 landscape]
      - 3:2 [1216x832 landscape]
      - 7:5 [1176x840 landscape]
      - 16:9 [1344x768 landscape]
      - 21:9 [1536x640 landscape]
      - 19:9 [1472x704 landscape]
      - 3:4 [896x1152 portrait]
      - 2:3 [832x1216 portrait]
      - 5:7 [840x1176 portrait]
      - 9:16 [768x1344 portrait]
      - 9:21 [640x1536 portrait]
      - 5:8 [768x1216 portrait]
      - 9:19 [704x1472 portrait]
  - id: ➕ Add Lora
    type: text
    label: ➕ Add Lora
    required: true
discord:
  command: dream
  inputs:
    - id: text
      nodeId: '198:3'
      field: text
      type: text
      label: text
      required: true
    - id: ratio_selected
      nodeId: '258'
      field: ratio_selected
      type: select
      label: ratio_selected
      required: true
      choices:
        - 1:1 [1024x1024 square]
        - 8:5 [1216x768 landscape]
        - 4:3 [1152x896 landscape]
        - 3:2 [1216x832 landscape]
        - 7:5 [1176x840 landscape]
        - 16:9 [1344x768 landscape]
        - 21:9 [1536x640 landscape]
        - 19:9 [1472x704 landscape]
        - 3:4 [896x1152 portrait]
        - 2:3 [832x1216 portrait]
        - 5:7 [840x1176 portrait]
        - 9:16 [768x1344 portrait]
        - 9:21 [640x1536 portrait]
        - 5:8 [768x1216 portrait]
        - 9:19 [704x1472 portrait]
    - id: ➕ Add Lora
      nodeId: '271'
      field: ➕ Add Lora
      type: text
      label: ➕ Add Lora
      required: true
  ui:
    embed:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
      show_footer: true
      image_position: top
      show_author: false
    buttons:
      - type: regenerate
        label: Regenerate
        style: primary
        emoji: ♻️
      - type: options
        label: Options
        style: secondary
        emoji: ⚙️
      - type: delete
        label: Delete
        style: danger
        emoji: 🗑️
      - type: chain
        label: Video This
        style: primary
        target_workflow: LTXVIA2V
        emoji: 📽️
    positions: {}
  loras: {}
