workflow_name: Krea2-Edit-Image
display_name: ''
discord_command: krea2-edit-image
ai_prompt:
  enabled: false
  category: image
  prompt_id: ''
  target_input: ''
description: Run krea2-edit-image workflow
mapping:
  aspect_ratio:
    - '66'
    - inputs
    - aspect_ratio
  prompt:
    - '69'
    - inputs
    - prompt
  image:
    - '70'
    - inputs
    - image
  lora_name:
    - '67'
    - inputs
    - lora_name
inputs:
  - id: aspect_ratio
    type: select
    label: aspect_ratio
    required: true
    choices:
      - 1:1 (Square)
      - 2:3 (Portrait Photo)
      - 3:2 (Photo)
      - 3:4 (Portrait Standard)
      - 4:3 (Standard)
      - 9:16 (Portrait Widescreen)
      - 16:9 (Widescreen)
      - 21:9 (Ultrawide)
  - id: prompt
    type: text
    label: prompt
    required: true
  - id: image
    type: image_upload
    label: image
    required: true
  - id: lora_name
    type: select
    label: lora_name
    required: true
    choices:
      - krea2_darkbrush.safetensors
      - Krea2_WoW_K2.safetensors
      - krea2_Enhancer.safetensors
discord:
  command: krea2-edit-image
  inputs:
    - id: aspect_ratio
      nodeId: '66'
      field: aspect_ratio
      type: select
      label: aspect_ratio
      required: true
      choices:
        - 1:1 (Square)
        - 2:3 (Portrait Photo)
        - 3:2 (Photo)
        - 3:4 (Portrait Standard)
        - 4:3 (Standard)
        - 9:16 (Portrait Widescreen)
        - 16:9 (Widescreen)
        - 21:9 (Ultrawide)
    - id: prompt
      nodeId: '69'
      field: prompt
      type: text
      label: prompt
      required: true
    - id: image
      nodeId: '70'
      field: image
      type: image_upload
      label: image
      required: true
    - id: lora_name
      nodeId: '67'
      field: lora_name
      type: select
      label: lora_name
      required: true
      choices:
        - krea2_darkbrush.safetensors
        - Krea2_WoW_K2.safetensors
        - krea2_Enhancer.safetensors
  ui:
    layout_version: v1
    embed:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      use_role_color: true
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
    v2_layout:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      use_role_color: true
      grid_columns: 2
      media_position: left
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
    buttons:
      - type: regenerate
        label: Regenerate
        style: primary
      - type: options
        label: Options
        style: secondary
      - type: delete
        label: Delete
        style: danger
    positions: {}
  loras:
    '67': Krea2.json
