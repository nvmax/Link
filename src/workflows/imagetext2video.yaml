workflow_name: imagetext2video
display_name: image to video (text voice and sounds)
discord_command: imagetext2video
description: Run imagetext2video workflow
mapping:
  image:
    - '269'
    - inputs
    - image
  text:
    - '276'
    - inputs
    - text
  PowerLoraLoaderHeaderWidget:
    - '327'
    - inputs
    - PowerLoraLoaderHeaderWidget
inputs:
  - id: image
    type: image_upload
    label: image
    required: true
  - id: text
    type: text
    label: text
    required: true
  - id: PowerLoraLoaderHeaderWidget
    type: select
    label: PowerLoraLoaderHeaderWidget
    required: true
discord:
  command: imagetext2video
  inputs:
    - id: image
      nodeId: '269'
      field: image
      type: image_upload
      label: image
      required: true
    - id: text
      nodeId: '276'
      field: text
      type: text
      label: text
      required: true
    - id: PowerLoraLoaderHeaderWidget
      nodeId: '327'
      field: PowerLoraLoaderHeaderWidget
      type: select
      label: PowerLoraLoaderHeaderWidget
      required: true
  ui:
    layout_version: v2
    embed:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      use_role_color: true
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
    v2_layout:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      use_role_color: true
      grid_columns: 2
      media_position: top
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
    buttons:
      - type: regenerate
        label: Regenerate
        style: primary
      - type: options
        label: Options
        style: secondary
      - type: delete
        label: Delete
        style: danger
    positions: {}
  loras:
    '327': ltxvlora.json
ai_prompt:
  enabled: false
  category: image
  prompt_id: ''
  target_input: ''
