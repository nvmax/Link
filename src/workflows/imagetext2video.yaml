workflow_name: imagetext2video
display_name: image to video (text voice and sounds)
discord_command: imagetext2video
description: Run imagetext2video workflow
mapping:
  image:
    - '269'
    - inputs
    - image
  text:
    - '276'
    - inputs
    - text
inputs:
  - id: image
    type: image_upload
    label: image
    required: true
  - id: text
    type: text
    label: text
    required: true
discord:
  command: imagetext2video
  inputs:
    - id: image
      nodeId: '269'
      field: image
      type: image_upload
      label: image
      required: true
    - id: text
      nodeId: '276'
      field: text
      type: text
      label: text
      required: true
  ui:
    embed:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      use_role_color: true
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
    buttons:
      - type: regenerate
        label: Regenerate
        style: primary
      - type: options
        label: Options
        style: secondary
      - type: delete
        label: Delete
        style: danger
    positions: {}
  loras: {}
