workflow_name: KleinEdit
display_name: Klein
discord_command: kleinedit
ai_prompt:
  enabled: false
  category: image
  prompt_id: ''
  target_input: ''
description: Run kleinedit workflow
mapping:
  text:
    - '75:74'
    - inputs
    - text
  image:
    - '76'
    - inputs
    - image
inputs:
  - id: text
    type: text
    label: text
    required: true
  - id: image
    type: image_upload
    label: image
    required: true
discord:
  command: kleinedit
  inputs:
    - id: text
      nodeId: '75:74'
      field: text
      type: text
      label: text
      required: true
    - id: image
      nodeId: '76'
      field: image
      type: image_upload
      label: image
      required: true
  ui:
    layout_version: v1
    embed:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      use_role_color: true
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
    v2_layout:
      title_template: '{user}''s Generation'
      color: '#5865F2'
      use_role_color: true
      grid_columns: 2
      media_position: left
      show_metadata:
        - prompt
        - seed
        - model
        - ratio
    buttons:
      - type: regenerate
        label: Regenerate
        style: primary
      - type: options
        label: Options
        style: secondary
      - type: delete
        label: Delete
        style: danger
    positions: {}
  loras: {}
