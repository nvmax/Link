<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK Inpaint Studio</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Discord Embedded App SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.4.0/dist/index.global.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- Main Workspace (Left Canvas Viewport + Right Sidebar Panel) -->
    <div class="main-workspace">
      <!-- Left Canvas Viewport -->
      <main id="viewport" class="viewport">
        <div id="canvas-stack" class="canvas-stack">
          <canvas id="bg-canvas"></canvas>
          <canvas id="mask-canvas"></canvas>
          <canvas id="grid-canvas"></canvas>
          <canvas id="cursor-canvas"></canvas>
        </div>
      </main>

      <!-- Right Sidebar Panel -->
      <aside class="sidebar-panel">
        <div class="sidebar-title">🎨 Inpaint Studio</div>

        <!-- Tool Selection -->
        <div class="sidebar-group">
          <span class="sidebar-label">Tool</span>
          <div class="btn-grid-2col">
            <button id="btn-brush" class="btn active" title="Brush (Paint Mask)">🖌️ Brush</button>
            <button id="btn-eraser" class="btn" title="Eraser (Remove Mask)">🧹 Eraser</button>
            <button id="btn-lasso" class="btn" title="Lasso (Freehand Polygon)">🎯 Lasso</button>
            <button id="btn-wand" class="btn" title="Magic Wand (Content-Aware Region Fill)">🪄 Wand</button>
            <button id="btn-grid-fill" class="btn" title="Grid Fill (Click Grid Cell to Fill)">🪟 Grid</button>
            <button id="btn-pan" class="btn" title="Pan (Drag Viewport)">✋ Pan</button>
          </div>
        </div>

        <!-- Brush Shape -->
        <div class="sidebar-group" id="shape-group">
          <span class="sidebar-label">Brush Shape</span>
          <div class="btn-grid-3col">
            <button id="btn-shape-circle" class="btn active" title="Circle Brush">⚪ Circle</button>
            <button id="btn-shape-square" class="btn" title="Square Brush">⏹️ Square</button>
            <button id="btn-shape-soft" class="btn" title="Soft Feathered Brush">🌫️ Soft</button>
          </div>
        </div>

        <!-- Grid Overlay Preset -->
        <div class="sidebar-group">
          <span class="sidebar-label">Grid Overlay</span>
          <select id="grid-select" class="select-input" title="Select Grid Overlay Preset">
            <option value="off">Off</option>
            <option value="1/2">1/2 (2x2)</option>
            <option value="1/3">1/3 (3x3)</option>
            <option value="1/4">1/4 (4x4)</option>
            <option value="3h">3 Horizontal</option>
            <option value="3v">3 Vertical</option>
            <option value="2h">2 Horizontal</option>
            <option value="2v">2 Vertical</option>
          </select>
        </div>

        <!-- Zoom Controls -->
        <div class="sidebar-group">
          <span class="sidebar-label">Zoom & Scale</span>
          <div class="zoom-bar">
            <button id="btn-zoom-out" class="btn btn-sm" title="Zoom Out (-)">🔍-</button>
            <span id="zoom-val" class="zoom-value">100%</span>
            <button id="btn-zoom-in" class="btn btn-sm" title="Zoom In (+)">🔍+</button>
            <button id="btn-zoom-reset" class="btn btn-sm" title="Reset Zoom / Fit Canvas">🎯 Fit</button>
          </div>
        </div>

        <!-- Sliders -->
        <div class="sidebar-group sliders-group">
          <!-- Size Slider -->
          <div class="slider-row" id="size-container">
            <div class="slider-info">
              <span class="sidebar-label">Brush Size</span>
              <span id="size-val" class="slider-val-text">40px</span>
            </div>
            <input type="range" id="size-slider" min="5" max="150" value="40">
          </div>

          <!-- Magic Wand Tolerance Slider -->
          <div class="slider-row" id="wand-tol-container">
            <div class="slider-info">
              <span class="sidebar-label">Wand Tolerance</span>
              <span id="wand-tol-val" class="slider-val-text">32</span>
            </div>
            <input type="range" id="wand-tol-slider" min="1" max="100" value="32">
          </div>

          <!-- Opacity Slider -->
          <div class="slider-row">
            <div class="slider-info">
              <span class="sidebar-label">Brush Opacity</span>
              <span id="opacity-val" class="slider-val-text">100%</span>
            </div>
            <input type="range" id="opacity-slider" min="10" max="100" value="100">
          </div>

          <!-- Overlay Slider -->
          <div class="slider-row">
            <div class="slider-info">
              <span class="sidebar-label">Mask Overlay</span>
              <span id="overlay-val" class="slider-val-text">65%</span>
            </div>
            <input type="range" id="overlay-slider" min="10" max="100" value="65">
          </div>
        </div>

        <!-- History & Mask Actions -->
        <div class="sidebar-group">
          <span class="sidebar-label">Actions</span>
          <div class="btn-grid-2col">
            <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)">↩️ Undo</button>
            <button id="btn-redo" class="btn" title="Redo (Ctrl+Y)">↪️ Redo</button>
            <button id="btn-toggle-mask" class="btn active" title="Toggle Mask Visibility">👁️ Mask</button>
            <button id="btn-clear" class="btn btn-danger" title="Clear Mask">🗑️ Clear</button>
          </div>
        </div>
      </aside>
    </div>

    <!-- Bottom Bar (Prompt & Submit) -->
    <footer class="bottom-bar">
      <input type="text" id="prompt-input" class="prompt-input" placeholder="Describe what you want to generate in the masked area..." />
      <button id="btn-submit" class="btn btn-primary">🎨 Submit Inpaint</button>
    </footer>

    <!-- Status / Loading Overlay -->
    <div id="status-overlay">
      <div class="spinner"></div>
      <div id="status-text" class="status-text">Initializing Inpaint Studio...</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
