services:
  bot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: link-bot-backend
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src/workflows:/app/src/workflows
      - ./src/ai_studio:/app/src/ai_studio
      - ${COMFY_PATH:-.}:/comfyui
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: link-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./src/workflows:/app/src/workflows
      - ./src/ai_studio:/app/src/ai_studio
    depends_on:
      - bot-backend
